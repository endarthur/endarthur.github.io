function random_surface(z_base, offset=10, amplitude=200, disc=4){
  const points = [];
  const values = [];
  const step = 2000.0/disc;

  for(i = 0; i<=disc; i++) for(j=0; j<=disc; j++){
    const z = (0.5 - Math.random())*amplitude + z_base;
    points.push([
      1000.0 - i*step,
      1000.0 - j*step,
      z-offset,
    ]);
    values.push(-offset);
    points.push([
      1000.0 - i*step,
      1000.0 - j*step,
      z+offset,
    ]);
    values.push(offset);
  }
  
  return [points, values];
}

const dist = (p0, p1) => {
  const dx = p1[0] - p0[0];
  const dy = p1[1] - p0[1];
  const dz = p1[2] - p0[2];

  return Math.sqrt(dx*dx+dy*dy+dz*dz);
};

const linear = (r) => r;

function RBF(points, values, kernel=linear){
  let D = math.zeros(points.length, points.length);
  D = D.map((v, [i, j], m) => kernel(dist(points[i], points[j]))+(i === j?0.01:0));
  const w = math.lusolve(D, values);
  return (x, z, y) => {
    const distances = points.map(p => dist(p, [x, y, z]));
    return math.dot(w, distances);
  }
}

const dyke = rotate(cuboid(10000, 10000, 50), [1, 0, 0], 15*Math.PI/180);
const volume = cuboid(900, 600, 900);

const older = difference(volume, dyke);
const bedrock = RBF(...random_surface(0.0));
const topo = RBF(...random_surface(100.0));



return [
  intersection(bedrock, older),
  difference(intersection(topo, older), bedrock),
  intersection(dyke, union(topo, bedrock), volume)
];

      function build_threejs_mesh(triangles, normals, color) {
        const vertices = [];
        const _normals = [];

        for (let i = 0; i < triangles.length; ++i)
          for (let j = 0; j < 3; ++j) {
            vertices.push(
              triangles[i][j][0],
              triangles[i][j][1],
              triangles[i][j][2]
            );
            if (normals.length > 0)
              _normals.push(
                normals[i][j][0],
                normals[i][j][1],
                normals[i][j][2]
              );
          }

        //
        function disposeArray() {
          this.array = null;
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(vertices, 3) //.onUpload(disposeArray)
        );
        if (normals.length > 0)
          geometry.setAttribute(
            "normal",
            new THREE.Float32BufferAttribute(_normals, 3) //.onUpload(disposeArray)
          );
        else geometry.computeVertexNormals();
        geometry.computeBoundingBox();

        //
        const material = new THREE.MeshStandardMaterial({
          color: color,
          wireframe: false,
          side: THREE.DoubleSide,
          roughness: 1.0,
          // flatShading: true,
        });
        const mesh = new THREE.Mesh(geometry, material);

        return mesh;
      }

            //   break;

            // case 69: // E
            //   control.setMode("scale");
            //   break;

            // case 82: // R
            //   control.setMode("rotate");
            //   break;

            case 83: // S
              orbit.screenSpacePanning = !orbit.screenSpacePanning;
              break;

            case 67: // C
              const position = currentCamera.position.clone();

              currentCamera = currentCamera.isPerspectiveCamera
                ? cameraOrtho
                : cameraPersp;
              currentCamera.position.copy(position);

              orbit.object = currentCamera;
              control.camera = currentCamera;

              currentCamera.lookAt(
                orbit.target.x,
                orbit.target.y,
                orbit.target.z
              );
              onWindowResize();
              break;

            // case 187:
            // case 107: // +, =, num+
            //   control.setSize(control.size + 0.1);
            //   break;

            // case 189:
            // case 109: // -, _, num-
            //   control.setSize(Math.max(control.size - 0.1, 0.1));
            //   break;

            // case 88: // X
            //   control.showX = !control.showX;
            //   break;

            // case 89: // Y
            //   control.showY = !control.showY;
            //   break;

            // case 90: // Z
            //   control.showZ = !control.showZ;
            //   break;

            // case 32: // Spacebar
            //   control.enabled = !control.enabled;
            //   break;
          }
        });

        window.addEventListener("keyup", function (event) {
          // switch (event.keyCode) {
          //   case 16: // Shift
          //     control.setTranslationSnap(null);
          //     control.setRotationSnap(null);
          //     control.setScaleSnap(null);
          //     break;
          // }
        });
      }

      function onWindowResize() {
        const aspect = window.innerWidth / window.innerHeight;

        cameraPersp.aspect = aspect;
        cameraPersp.updateProjectionMatrix();

        cameraOrtho.left = cameraOrtho.bottom * aspect;
        cameraOrtho.right = cameraOrtho.top * aspect;
        cameraOrtho.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        render();
      }

      function render() {
        renderer.render(scene, currentCamera);
      }

      function addDirectionalLight(x, y, z, color, intensity) {
        var directionalLight = new THREE.DirectionalLight(color, intensity);
        directionalLight.position.set(x, y, z);
        scene.add(directionalLight);
      }
    </script>
  </body>
